<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Neon Glow Border Gradient -->
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Drop Shadow Filter for Glow -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00D4FF" flood-opacity="0.3" />
    </filter>

    <style>
      .text-label {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        fill: #94a3b8;
        font-size: 13px;
      }
      .text-value {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 500;
        fill: #f1f5f9;
        font-size: 14px;
      }
      .text-link {
        fill: #00D4FF;
        font-weight: 600;
        text-decoration: none;
      }
      .title {
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        font-size: 18px;
        fill: #00D4FF;
      }
      
      /* Slide-in & Fade-in Animations */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes slideInLeft {
        from { transform: translateX(-20px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes borderPulse {
        0%, 100% { stroke-opacity: 0.8; }
        50% { stroke-opacity: 0.4; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-4px); }
      }

      .animated-bg {
        animation: fadeIn 1.2s ease-out;
      }
      .animated-border {
        animation: borderPulse 4s infinite ease-in-out;
      }
      .col-1 {
        animation: slideInLeft 0.8s ease-out forwards;
      }
      .col-2 {
        animation: slideInLeft 1s ease-out forwards;
      }
      .float-icon {
        animation: float 3s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="600" height="280" rx="16" fill="url(#bgGrad)" class="animated-bg" />
  
  <!-- Glowing Border -->
  <rect x="2" y="2" width="596" height="276" rx="14" fill="none" stroke="url(#neonGrad)" stroke-width="2" class="animated-border" filter="url(#glow)" />

  <!-- Title / Header -->
  <g transform="translate(30, 45)">
    <text class="title" x="0" y="0">⚡ Profile &amp; Contact Card</text>
    <line x1="0" y1="12" x2="540" y2="12" stroke="#334155" stroke-width="1" />
  </g>

  <!-- COLUMN 1: Personal Info -->
  <g class="col-1" transform="translate(30, 85)">
    <!-- Name -->
    <text class="text-label" x="0" y="20">👤 Full Name</text>
    <text class="text-value" x="120" y="20">G.A.M. Praveen N. Gunarathna</text>

    <!-- Alias -->
    <text class="text-label" x="0" y="55">🏷️ Alias</text>
    <text class="text-value" x="120" y="55">Praveen Gunarathna</text>

    <!-- Location -->
    <text class="text-label" x="0" y="90">📍 Location</text>
    <text class="text-value" x="120" y="90">Sri Lanka 🇱🇰</text>

    <!-- Phone -->
    <text class="text-label" x="0" y="125">📞 Phone</text>
    <text class="text-value" x="120" y="125">076 016 8785</text>

    <!-- Email -->
    <text class="text-label" x="0" y="160">📧 Email</text>
    <text class="text-value text-link" x="120" y="160">praveennethsith06@gmail.com</text>
  </g>

  <!-- Vertical Divider -->
  <line x1="390" y1="85" x2="390" y2="245" stroke="#334155" stroke-width="1" />

  <!-- COLUMN 2: Professional Roles -->
  <g class="col-2" transform="translate(415, 85)">
    <!-- Role -->
    <text class="text-label" x="0" y="20">💼 Role</text>
    <text class="text-value" x="0" y="42">Freelance Dev</text>

    <!-- Status -->
    <text class="text-label" x="0" y="80">🗓️ Since</text>
    <text class="text-value" x="0" y="102">2024 — Present</text>

    <!-- GitHub link -->
    <text class="text-label" x="0" y="140">🌐 GitHub</text>
    <text class="text-value text-link" x="0" y="162">Praveen061215</text>
  </g>
</svg>
