<svg xmlns="http://www.w3.org/2000/svg" width="500" height="310" viewBox="0 0 500 310">
  <defs>
    <!-- Dark background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>

    <!-- Cyan → navy → cyan border gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00D4FF"/>
      <stop offset="50%"  stop-color="#1E3799"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Subtle dot-grid pattern -->
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#21262D"/>
    </pattern>

    <!-- Clip for rounded card -->
    <clipPath id="card-clip">
      <rect x="2" y="2" width="496" height="306" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- ════ CARD BASE ════ -->
  <rect x="2" y="2" width="496" height="306" rx="16" ry="16" fill="url(#bgGrad)"/>
  <!-- Dot grid overlay -->
  <rect x="2" y="2" width="496" height="306" rx="16" ry="16" fill="url(#dots)" opacity="0.9"/>

  <!-- ════ ANIMATED NEON BORDER ════ -->
  <rect x="2" y="2" width="496" height="306" rx="16" ry="16"
        fill="none" stroke="url(#borderGrad)" stroke-width="2.5"
        stroke-dasharray="1608" stroke-dashoffset="1608">
    <animate attributeName="stroke-dashoffset"
             from="1608" to="0"
             dur="5s" repeatCount="indefinite" calcMode="linear"/>
  </rect>

  <!-- ════ TOP ACCENT LINE (slides in) ════ -->
  <line x1="32" y1="104" x2="32" y2="104" stroke="#00D4FF" stroke-width="2" stroke-linecap="round">
    <animate attributeName="x2" from="32" to="468" dur="1s" fill="freeze"
             begin="0.2s" calcMode="spline"
             keyTimes="0;1" keySplines="0.16 1 0.3 1"/>
    <animate attributeName="opacity" from="0" to="1" dur="0.3s" fill="freeze" begin="0.2s"/>
  </line>

  <!-- ════ STATUS PILL ════ -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" fill="freeze" begin="0.1s"/>
    <rect x="350" y="22" width="120" height="26" rx="13" fill="#161B22" stroke="#21262D" stroke-width="1"/>
    <circle cx="366" cy="35" r="5" fill="#00D4FF" filter="url(#glow)">
      <animate attributeName="r" values="5;7;5" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="378" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="11" fill="#8B949E" font-weight="600">Open to Work</text>
  </g>

  <!-- ════ NAME (fades in, slides up) ════ -->
  <g transform="translate(32, 48)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="0.15s"/>
    <!-- First name -->
    <text y="0" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
          font-size="28" font-weight="800" fill="#39ff14" letter-spacing="-1"
          filter="url(#glow)">Praveen</text>
    <!-- Accent last name -->
    <text x="175" y="0" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
          font-size="28" font-weight="800" fill="#39ff14" letter-spacing="-1"
          filter="url(#glow)">Gunarathna</text>
    <!-- Sub-role -->
    <text y="24" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif"
          font-size="13" fill="#8B949E" font-weight="500" letter-spacing="0.5">
      Freelance Software Developer  |  Sri Lanka
    </text>
  </g>

  <!-- ════ DETAILS (slide up from below) ════ -->
  <g transform="translate(32, 130)" opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" fill="freeze" begin="0.35s"/>

    <!-- Row: Name -->
    <text y="0"  font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#00D4FF">Name</text>
    <text x="90" y="0"  font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#C9D1D9">: G.A.M. Praveen N. Gunarathna</text>

    <!-- Row: Location -->
    <text y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#00D4FF">Location</text>
    <text x="90" y="26" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#C9D1D9">: Sri Lanka</text>

    <!-- Row: Phone -->
    <text y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#00D4FF">Phone</text>
    <text x="90" y="52" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#C9D1D9">: 076 016 8785</text>

    <!-- Row: Email -->
    <text y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#00D4FF">Email</text>
    <text x="90" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#C9D1D9">: praveennethsith06@gmail.com</text>

    <!-- Row: GitHub -->
    <text y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#00D4FF">GitHub</text>
    <text x="90" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#C9D1D9">: github.com/Praveen061215</text>

    <!-- Row: LinkedIn -->
    <text y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#00D4FF">LinkedIn</text>
    <text x="90" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#C9D1D9">: praveengunarathna-5a478535a</text>

    <!-- Row: Career -->
    <text y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#00D4FF">Role</text>
    <text x="90" y="156" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#C9D1D9">: Software / Mobile / Web Developer</text>
  </g>

  <!-- ════ BOTTOM WATERMARK ════ -->
  <text x="32" y="294"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="9.5" fill="#58A6FF" font-weight="600" opacity="0.7"
        letter-spacing="2">BUILDING DIGITAL SOLUTIONS</text>

  <!-- Right corner cursor blink -->
  <text x="460" y="294"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14" fill="#00D4FF">|
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </text>
</svg>
